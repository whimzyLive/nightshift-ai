id: sdlc
label: SDLC plugin 0.45.4 (full lifecycle)
# ---------------------------------------------------------------------------
# This cell runs SDLC's real lifecycle against a real Jira issue and opens a
# real pull request, so the shipped output can be reviewed rather than
# inferred from a cost table.
#
# Three things make that safe rather than reckless:
#
#   1. Its own Jira issue. `scratch_ticket: true` makes provisioning clone the
#      source ticket into a per-cell issue labelled `bench-run`. The source
#      ticket is never written to, and -- decisively -- two SDLC cells of the
#      same story get DIFFERENT story keys. They would otherwise both derive
#      the branch `feat/<KEY>`, and the playbook reuses an existing branch
#      rather than duplicating it, so the second cell would check out the
#      first cell's finished work and measure nothing.
#   2. Draft pull requests. The PreToolUse guard denies `gh pr create` without
#      `--draft` and denies `gh pr ready` outright, so branch protection and
#      auto-merge cannot land one. The deny reason is fed back to the session,
#      which retries correctly rather than failing blind.
#   3. A per-cell ref allow-list. Pushes are permitted to this cell's bench
#      branch, anything under `bench/`, and `feat|fix/<SCRATCH-KEY>` -- nothing
#      else. main, master and develop are refused whatever the config says,
#      and merge, rebase and force-push stay denied outright.
#
# Clean up with `/bench:cleanup <SOURCE-TICKET>`.
# ---------------------------------------------------------------------------
scratch_ticket: true
plugins:
  enable:
    - sdlc@nightshift
version:
  plugin: sdlc@nightshift
  version: 0.45.4
setup: []
permissions:
  # The SDLC lifecycle is Jira- and GitHub-coupled by design; measuring it
  # without these measures a blocked session, not the approach.
  - Bash(acli:*)
  - Bash(gh:*)
  - Bash(bash:*)
run:
  model: claude-opus-5
  # `/sdlc:auto` is the plugin's own one-shot entry point: it triages the
  # story, routes it through spec -> gate -> plan+impl, and runs its review
  # loop inline. Passing the story key alone is how the plugin is actually
  # used, so the row measures the product rather than a benchmark-shaped
  # variant of it.
  #
  # The ticket body is NOT pasted in. /sdlc:auto fetches the story itself,
  # and handing it pre-fetched text would both double the ticket in context
  # and skip a step the approach genuinely pays for. This is the one adapter
  # whose prompt is deliberately shorter than the others.
  # NOT `/sdlc:auto {{ticket_key}}`. A headless `claude -p` session does not
  # accept plugin commands in slash form: the CLI resolves the leading token
  # itself and answers `Unknown command: /sdlc:auto` with num_turns 0,
  # duration 11ms and cost $0 -- observed on NA-82. The plugin's commands are
  # exposed to a session as SKILLS (`claude plugin details sdlc@nightshift`
  # lists `auto`, `impl`, `spec` and the rest under Skills), which a model
  # invokes through its Skill tool, not by typing a slash.
  #
  # So the prompt asks for the capability by name in plain language and lets
  # the session route it. The story key is on its own line so it cannot be
  # mistaken for part of the instruction.
  #
  # Draft-PR enforcement stays in the PreToolUse guard rather than here: the
  # guard denies `gh pr create` without `--draft` and returns that as the
  # reason, which the session sees and retries on.
  prompt: |
    Use the sdlc:auto skill to run the full SDLC lifecycle for this Jira story,
    end to end, exactly as that skill specifies.

    Story key: {{ticket_key}}
  flags: ['--permission-mode', 'acceptEdits']
# SDLC runs its whole lifecycle inline in one session, dispatching domain
# agents with the Agent tool rather than typing slash commands. So markers
# match the `subagent_type` of each dispatch, which measure.py exposes to
# markers via tool-call inputs. Matching agent identity means the phase
# boundary is where the session actually handed work to the next role.
phases:
  - { id: spec, marker: 'solutions-architect' }
  - { id: plan, marker: 'tech-lead' }
  - {
      id: impl,
      marker: 'web-engineer|platform-engineer|database-administrator|sync-engineer|mobile-engineer|ai-enablement-engineer|principal-engineer',
    }
  - { id: review-fix, marker: 'qa-engineer|code-reviewer|sdlc:review' }
  - { id: docs, marker: 'knowledge-engineer|sdlc:docs' }
teardown: []
