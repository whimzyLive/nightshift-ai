id: opus
label: Direct Opus, no framework
# No setup: this approach deliberately brings no tooling, no skills, no process.
setup: []
# The control arm, and the only row whose value depends entirely on this list
# being empty. Left unset, the worktree inherits the repository's committed
# .claude/settings.json and the operator's ~/.claude/settings.json -- which on
# the machine this was written for meant this "no framework" cell ran with the
# SDLC plugin loaded and with superpowers' SessionStart hook telling it "You
# have superpowers." provision.py writes an explicit `false` for every
# installed plugin because of this line.
plugins:
  enable: []
run:
  # Required. Passed to `claude --model`, so the row is labelled honestly:
  # without it the session runs on whatever the operator's default happens
  # to be and "Direct Opus" is a claim the measurement cannot support.
  model: claude-opus-5
  prompt: |
    Implement the following ticket in this repository.

    Ticket: {{ticket_key}} — {{ticket_summary}}

    {{ticket_description}}

    Acceptance criteria:
    {{ticket_acs}}

    Work on the current branch. Commit your changes when done.
    Run the test suite with: {{test_command}}
  flags: ['--permission-mode', 'acceptEdits']
# One measured phase. This approach has no spec, plan, review or docs ceremony —
# that absence is the thing being measured, not an omission in the adapter.
phases:
  - { id: impl, marker: '' }
teardown: []
