# Skill suggestion map for /init Step 3.5.
# Edit this file to change which skills /init suggests for a detected stack —
# no command-file edit needed. Each entry carries:
#   name        — the skill identifier (matches skills.json and agent override)
#   description — the one-line description shown to the user in the picker
#   domains     — which domain agent(s) this skill is relevant to
#   when        — detection conditions that cause this skill to be suggested
#                 (any matching condition adds the skill to the candidate list;
#                  the skill appears at most once even if multiple conditions match)
#   dispatch    — (optional) how /init writes the skill's row in .claude/project/skills.json
#                 (refs/skills-manifest.md): `paths` (globs a dispatch's owned paths must
#                 overlap), `mode` (agent modes the row applies to) and `step` (the phrase shown
#                 to the agent as the point of use). Absent → `when: {}` in the manifest, so the
#                 skill is named on every dispatch to its domain agents.
#
# Install source — how /init Step 4f gets the skill content. Resolved in this
# precedence order; declare the first that applies:
#   source      — (preferred) the EXACT location of the skill content, so /init
#                 downloads the real skill (not a stub). Either a git repository
#                 ref (https or github:owner/repo) or a raw URL to a single
#                 SKILL.md. /init fetches it into `.claude/skills/<name>/`.
#   path        — (optional, with a git `source`) the skill's subdirectory inside
#                 that repo (e.g. `skills/hono-api`). Only that directory is copied.
#   ref         — (optional, with a git `source`) branch / tag / commit to fetch;
#                 defaults to the repo's default branch. /init checks the ref out
#                 explicitly (so a commit SHA works, unlike `git clone --branch`).
#                 NOTE on version lockstep: an entry that sources a skill from THIS
#                 repo (the plugin's own repo) with no `ref` tracks the moving default
#                 branch, so two consumers on the same pinned plugin version can fetch
#                 different skill content over time. For reproducible, version-locked
#                 installs, pin `ref` to a release tag (or commit) cut alongside each
#                 plugin release. (No release tags exist yet — adopt tagging to close
#                 this fully; until then these entries intentionally track the branch.)
#   plugin      — (optional, alternative to `source`) a marketplace plugin that
#                 bundles this skill, as `<plugin>@<marketplace>`. When set (and no
#                 `source`), /init installs that plugin (`claude plugin install
#                 <plugin>@<marketplace> --scope project`) — Claude Code has no
#                 per-skill install, skills ship inside plugins.
#   marketplace — (optional) the marketplace source to `claude plugin marketplace
#                 add` before installing `plugin`. Required whenever `plugin` is set.
# Declare none of the above for project-convention skills with no published
# location; those are scaffolded as a local starter at `.claude/skills/<name>/SKILL.md`.

skills:
  - name: hono-api
    description: Schema-first Hono + @hono/zod-openapi architecture — composable routers, class-based service layer, webhook strategy pattern, typed validation
    domains: [platform-engineer]
    dispatch:
      step: before adding or changing a route, service or webhook handler
    source: https://github.com/whimzyLive/nightshift-ai.git
    path: skills/hono-api
    when:
      - framework: Hono

  - name: api-routes
    description: REST/HTTP handler structure, input validation, and error response shapes
    domains: [platform-engineer]
    dispatch:
      step: before adding or changing an HTTP handler
    when:
      - framework: Express
      - framework: NestJS
      - framework: Fastify

  - name: vercel-react-best-practices
    description: Next.js / React patterns optimised for Vercel deployment
    domains: [web-engineer]
    dispatch:
      step: before writing or changing a React component or page
    # Third-party: Vercel Labs' official skill — downloaded from upstream, not copied.
    source: https://github.com/vercel-labs/agent-skills.git
    path: skills/react-best-practices
    when:
      - framework: Next.js
      - framework: Remix
      - framework: Astro

  - name: vercel-composition-patterns
    description: Vercel monorepo workspace layout and composition patterns
    domains: [web-engineer]
    dispatch:
      step: before changing workspace layout or a shared package
    # Third-party: Vercel Labs' official skill — downloaded from upstream, not copied.
    source: https://github.com/vercel-labs/agent-skills.git
    path: skills/composition-patterns
    when:
      - framework: Next.js
      # Also suggested when pnpm monorepo is detected (see monorepo_detection below).
      # The de-duplicate rule ensures it appears at most once.
      - package_manager_monorepo: pnpm

  - name: react-components
    description: React component patterns, hooks, and composition conventions
    domains: [web-engineer]
    dispatch:
      step: before writing or changing a component
    # Third-party: Google Labs' Stitch skill — downloaded from upstream, not copied.
    source: https://github.com/google-labs-code/stitch-skills.git
    path: plugins/stitch-build/skills/react-components
    when:
      - framework: React
      # Vue has no dedicated built-in skill; react-components is the closest match.
      # Skip this suggestion if a Vue-specific skill becomes available.
      - framework: Vue

  - name: typeorm
    description: TypeORM entity, migration, query, and Data Mapper conventions for TypeScript
    domains: [platform-engineer, database-administrator]
    dispatch:
      paths: ['**/entities/**', '**/entity/**', '**/migrations/**']
      step: before changing an entity, a migration or a query
    source: https://github.com/whimzyLive/nightshift-ai.git
    path: skills/typeorm
    when:
      - dep: typeorm

  - name: electrodb
    description: ElectroDB DynamoDB ORM — entity schema, index/access-pattern modeling, CRUD and update expressions, single-table design
    domains: [platform-engineer, database-administrator]
    dispatch:
      paths: ['**/entities/**', '**/entity/**']
      step: before modeling an entity or an access pattern
    source: https://github.com/whimzyLive/nightshift-ai.git
    path: skills/electrodb
    when:
      - dep: electrodb

  - name: atomic-design
    description: Framework-agnostic atomic design methodology — decompose any UI into atoms, molecules, organisms, templates, and pages
    domains: [web-engineer, mobile-engineer, designer]
    dispatch:
      step: before decomposing a UI into components
    source: https://github.com/whimzyLive/nightshift-ai.git
    path: skills/atomic-design
    when:
      - framework: React
      - framework: Vue
      - framework: Next.js
      - framework: React Native
      - framework: Expo

# Frameworks / ORMs with no built-in skill suggestion — user must add via "Other":
#   Svelte       → no built-in suggestion
#   FastAPI      → no built-in suggestion
#   Flask        → no built-in suggestion
#   Django       → no built-in suggestion
#   Axum         → no built-in suggestion
#   Actix        → no built-in suggestion
#   Python       → no built-in suggestion
#   Rust / Go    → no built-in suggestion
#   TypeScript   → no extra suggestion (strictness rules go in the agent override)
#   Prisma       → no built-in suggestion (the typeorm skill is TypeORM-specific and
#                  does NOT transfer; add a Prisma skill via "Other" when one exists)
#   Drizzle      → no built-in suggestion (same — not covered by the typeorm skill)

# Agent-to-skill domain mapping.
# Used by /init Step 4d to set each manifest row's `agents`.
# Each skill's `domains` list above is the authoritative source;
# this summary lists the built-in skills per agent for quick reference.
#
# platform-engineer  : hono-api, api-routes, typeorm, electrodb
# web-engineer       : react-components, vercel-react-best-practices, vercel-composition-patterns, atomic-design
# mobile-engineer    : atomic-design
# designer           : atomic-design
# database-administrator : typeorm, electrodb
# sync-engineer      : (no built-in suggestions; add custom sync skills via "Other")

# Monorepo detection used for the vercel-composition-patterns / pnpm condition above.
monorepo_detection:
  command: 'find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" | wc -l'
  rule: 'count > 1 => monorepo'
  # When package_manager = pnpm AND this count > 1, add vercel-composition-patterns
  # to the candidate list (if not already present from the framework conditions).
