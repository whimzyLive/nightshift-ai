name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps

      - run: pnpm nx format:check --base="remotes/origin/main"
      - run: pnpm nx run-many -t lint test build typecheck e2e
      - run: bash plugins/sdlc/scripts/check-agent-skill-preloads.sh
      - run: bash plugins/sdlc/scripts/check-plugin-docs-format.sh
      - run: bash plugins/sdlc/scripts/check-frontmatter.sh
      - run: bash plugins/sdlc/scripts/__tests__/docs-sync-fixtures.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/prettier-ignore.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/loop-budget.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/resolve-ai-workflow-mode.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/assert-workspace-clean.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/artifact-encoding.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/context-reuse.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/bounded-reads.test.sh
      - run: bash tools/sdlc-analyser/__tests__/read-bounding.test.sh
      - run: bash tools/sdlc-analyser/__tests__/context-residency.test.sh
      - run: bash plugins/sdlc/scripts/__tests__/session-boundary.test.sh
      - run: bash .claude/hooks/__tests__/rtk-line-scan.test.sh
